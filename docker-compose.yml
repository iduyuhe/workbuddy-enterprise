# WorkBuddy Enterprise Edition — 私有化部署包（MVP 起步）
# 用法：
#   cp .env.example .env && docker compose up -d
# 默认仅启动核心链路；可加 --profile obs 启动可观测，--profile llm 启动推理引擎。
# 注意：vLLM/SGLang 需要 GPU 节点；生产请用 K8s+Helm（阶段 2）。

services:
  # ===================== 中间件 =====================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PG_USER:-wb}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-changeme}
      POSTGRES_DB: ${PG_DB:-workbuddy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    networks: [internal]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrantdata:/qdrant/storage
    networks: [internal]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    networks: [internal]
    restart: unless-stopped

  # ===================== 推理引擎（--profile llm）=====================
  vllm:
    image: vllm/vllm-openai:latest
    profile: ["llm"]
    command: >
      --model Qwen/Qwen3-235B-A22B-FP8
      --tensor-parallel-size ${VLLM_TP:-8}
      --dtype auto --enable-prefix-caching
      --host 0.0.0.0 --port 8080
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${VLLM_GPUS:-8}
              capabilities: [gpu]
    ports: ["8080:8080"]
    networks: [internal]
    restart: unless-stopped

  sglang:
    image: lmsysorg/sglang:latest
    profile: ["llm"]
    command: >
      --model-path deepseek-ai/DeepSeek-V3
      --host 0.0.0.0 --port 8081
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${SGLANG_GPUS:-8}
              capabilities: [gpu]
    ports: ["8081:8081"]
    networks: [internal]
    restart: unless-stopped

  # ===================== 业务微服务 =====================
  gateway:
    build: { context: ./src/gateway, dockerfile: Dockerfile }
    environment:
      AUTH_SERVICE_URL: http://auth-service:8002
      AUDIT_SERVICE_URL: http://audit-service:8006
      REDIS_URL: redis://redis:6379/0
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    ports: ["8000:8000"]
    depends_on: [auth-service, audit-service]
    networks: [internal]
    restart: unless-stopped

  auth-service:
    build: { context: ./src/auth-service, dockerfile: Dockerfile }
    environment:
      DATABASE_URL: postgresql://${PG_USER:-wb}:${PG_PASSWORD:-changeme}@postgres:5432/${PG_DB:-workbuddy}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    depends_on: [postgres]
    networks: [internal]
    restart: unless-stopped

  model-gateway:
    build: { context: ./src/model-gateway, dockerfile: Dockerfile }
    environment:
      VLLM_BASE_URL: http://vllm:8080
      SGLANG_BASE_URL: http://sglang:8081
      CLAUDE_BASE_URL: ${CLAUDE_BASE_URL:-}
      SECRET_BACKEND: ${SECRET_BACKEND:-file}
    depends_on: [vllm]
    profiles: ["llm"]
    networks: [internal]
    restart: unless-stopped

  skills-registry:
    build: { context: ./src/skills-registry, dockerfile: Dockerfile }
    environment:
      DATABASE_URL: postgresql://${PG_USER:-wb}:${PG_PASSWORD:-changeme}@postgres:5432/${PG_DB:-workbuddy}
      SKILLS_ROOT: /data/skills
    volumes: ["- skillsdata:/data/skills"]
    depends_on: [postgres]
    networks: [internal]
    restart: unless-stopped

  mcp-connector:
    build: { context: ./src/mcp-connector, dockerfile: Dockerfile }
    environment:
      DATABASE_URL: postgresql://${PG_USER:-wb}:${PG_PASSWORD:-changeme}@postgres:5432/${PG_DB:-workbuddy}
      SECRET_BACKEND: ${SECRET_BACKEND:-file}
    depends_on: [postgres]
    networks: [internal]
    restart: unless-stopped

  knowledge-service:
    build: { context: ./src/knowledge-service, dockerfile: Dockerfile }
    environment:
      DATABASE_URL: postgresql://${PG_USER:-wb}:${PG_PASSWORD:-changeme}@postgres:5432/${PG_DB:-workbuddy}
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_MODEL: bge-m3
      MINERU_HOME: /data/mineru
    volumes: ["- minerudata:/data/mineru"]
    depends_on: [postgres, qdrant]
    networks: [internal]
    restart: unless-stopped

  audit-service:
    build: { context: ./src/audit-service, dockerfile: Dockerfile }
    environment:
      DATABASE_URL: postgresql://${PG_USER:-wb}:${PG_PASSWORD:-changeme}@postgres:5432/${PG_DB:-workbuddy}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-180}
    depends_on: [postgres]
    networks: [internal]
    restart: unless-stopped

  frontend:
    build: { context: ./src/frontend, dockerfile: Dockerfile }
    ports: ["3000:80"]
    depends_on: [gateway]
    networks: [internal]
    restart: unless-stopped

  # ===================== 可观测（--profile obs）=====================
  prometheus:
    image: prom/prometheus:latest
    profile: ["obs"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports: ["9090:9090"]
    networks: [internal]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    profile: ["obs"]
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports: ["3100:3000"]
    depends_on: [prometheus]
    networks: [internal]
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:latest
    profile: ["obs"]
    environment:
      DATABASE_URL: postgresql://${PG_USER:-wb}:${PG_PASSWORD:-changeme}@postgres:5432/${PG_DB:-workbuddy}
      SALT: ${LANGFUSE_SALT:-changeme}
      ENCRYPTION_KEY: ${LANGFUSE_KEY:-changeme}
    ports: ["3101:3000"]
    depends_on: [postgres]
    networks: [internal]
    restart: unless-stopped

volumes:
  pgdata:
  qdrantdata:
  redisdata:
  skillsdata:
  minerudata:
  promdata:
  grafanadata:

networks:
  internal:
    driver: bridge
