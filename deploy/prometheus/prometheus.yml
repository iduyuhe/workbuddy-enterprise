global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:8000']
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:8002']
  - job_name: 'model-gateway'
    static_configs:
      - targets: ['model-gateway:8001']
  - job_name: 'skills-registry'
    static_configs:
      - targets: ['skills-registry:8003']
  - job_name: 'mcp-connector'
    static_configs:
      - targets: ['mcp-connector:8004']
  - job_name: 'knowledge-service'
    static_configs:
      - targets: ['knowledge-service:8005']
  - job_name: 'audit-service'
    static_configs:
      - targets: ['audit-service:8006']
