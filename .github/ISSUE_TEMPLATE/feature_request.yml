name: Feature Request
description: 提出一个新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题？
      description: 当前痛点或缺失的能力。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案 / 行为
      description: 你希望怎么实现，或期望的交互是什么。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 背景与替代方案
      description: 为什么需要它？有没有绕过方式或备选设计？
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 涉及领域
      options:
        - 部署 / 运维
        - 模型网关
        - 知识库 RAG
        - 技能 / MCP
        - 认证 / 权限 / 审计
        - 前端体验
        - 安全 / 合规
        - 其他
    validations:
      required: false
