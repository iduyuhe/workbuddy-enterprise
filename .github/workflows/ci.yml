name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-lint:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all backend services
        run: |
          fail=0
          for d in src/gateway src/auth-service src/model-gateway src/knowledge-service src/skills-registry src/mcp-connector src/audit-service; do
            echo "== compile $d =="
            python -m compileall -q "$d" || fail=1
          done
          exit $fail

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
