{{- $secretName := printf "%s-secrets" .Release.Name }}
{{- if .Values.postgresql.existingSecret }}
{{- $secretName = .Values.postgresql.existingSecret }}
{{- end }}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled (and $svc.canary $svc.canary.enabled) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}-canary
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/canary: "true"
    {{- include "wb.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.canary.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/canary: "true"
      {{- include "wb.selectorLabels" $ | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/canary: "true"
        {{- include "wb.selectorLabels" $ | nindent 8 }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image.repository }}:{{ $svc.canary.image.tag }}"
          imagePullPolicy: {{ $svc.image.pullPolicy | default $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          env:
            {{- include "wb.serviceEnv" (dict "root" $ "svc" $svc "name" $name "secretName" $secretName) | nindent 12 }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
{{- end }}
{{- end }}
