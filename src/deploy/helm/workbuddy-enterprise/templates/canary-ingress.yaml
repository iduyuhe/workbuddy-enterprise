{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled (and $svc.canary $svc.canary.enabled) (eq $name "gateway") }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Release.Name }}-gateway-canary
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/canary: "true"
    {{- include "wb.labels" $ | nindent 4 }}
  annotations:
    # Nginx Ingress 灰度发布：按权重切流；或置 canary-by-header 做精准灰度
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: {{ $svc.canary.weight | default 10 | quote }}
    nginx.ingress.kubernetes.io/canary-by-header: "X-Canary"
    nginx.ingress.kubernetes.io/canary-by-header-value: "always"
spec:
  ingressClassName: {{ $.Values.global.ingressClassName }}
  rules:
    - host: {{ $.Values.global.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-gateway-canary
                port:
                  number: {{ $svc.port }}
{{- end }}
{{- end }}
