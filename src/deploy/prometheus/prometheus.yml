global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 后端 FastAPI 指标（需 backend 暴露 /metrics，接入 prometheus-client）
  - job_name: "backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8080"]

  # vLLM 推理服务指标（vLLM 自带 /metrics 端点）
  - job_name: "vllm"
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm:8000"]

  # 可选：SGLang（若启用 DeepSeek）暴露 /metrics
  # - job_name: "sglang"
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["sglang:30000"]
