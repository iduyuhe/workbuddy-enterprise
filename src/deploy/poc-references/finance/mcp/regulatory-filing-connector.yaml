# 监管报送系统连接器规格（finance）
# 对齐 mcp-connector 的 POST /api/mcp/servers 与 /{id}/sync。
# secret_ref 走平台密钥保管，不在清单中落明文。
name: 监管报送系统连接器
transport: sse
endpoint: http://regfiling-internal:9100/sse
secret_ref: vault://regfiling-readonly
tools:
  - name: query_filing_status
    description: 查询指定报送期/报表的报送状态与缺失字段
    schema_json:
      type: object
      properties:
        period: { type: string, description: 报送期，如 2026Q2 }
        report_id: { type: string, description: 报表编号，如 EAST / 1104 / G12 }
      required: [period]
  - name: fetch_regulation_updates
    description: 拉取指定时间段内的监管新规/口径变更
    schema_json:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        topic: { type: string, description: 主题，如 反洗钱 / 资本充足 }
      required: [from, to]
  - name: query_obligation_calendar
    description: 查询本期应报报表清单与截止日
    schema_json:
      type: object
      properties:
        period: { type: string, description: 报送期 }
      required: [period]
  - name: submit_filing_draft
    description: 提交报送草稿（需合规官在报送系统复核后正式提交）
    schema_json:
      type: object
      properties:
        report_id: { type: string }
        period: { type: string }
        payload_ref: { type: string, description: 报表数据引用 }
      required: [report_id, period]
