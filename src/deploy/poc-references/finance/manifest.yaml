# ---- ② Killer Scenario 定义 ----
scenario:
  target_customer: 银行/券商/保险的合规部 + 研究所（投研），受强监管、文档与报送压力大。
  pain_points:
    - 研究员写研报耗时长，信息检索与格式校验占用大量精力。
    - 合规条款比对靠人工逐条核对，覆盖不全、易漏判。
    - 监管报送（EAST/1104/反洗钱等）字段多、口径易错，差错即受罚。
  killer_scenario: |
    研究员上传研报草稿/素材 → 智能体做摘要与问答、核对数据口径 → 「合规条款比对」技能把研报表述与
    内部合规制度、监管红线逐条比对并标注风险 → 「监管报送核对」技能经报送系统连接器核对报表字段口径、
    提示缺失项与差错 → 输出合规结论 + 报送校验报告。全程留痕（审计），满足可回溯要求。
  success_metrics:
    - id: report-cycle
      name: 研报成稿周期
      baseline: "3 个工作日/篇"
      target: "≤1 个工作日/篇"
      measure: 系统时间戳（立项→成稿）
    - id: clause-coverage
      name: 合规条款比对覆盖率
      baseline: "≈人工 40%（抽样）"
      target: "100% 逐条比对"
      measure: 比对任务统计
    - id: filing-error
      name: 监管报送差错率
      baseline: "0.8%（受罚风险）"
      target: "≤0.1%"
      measure: 报送复核差错
    - id: manual-hours
      name: 合规人工复核工时/周
      baseline: "40 人时/周"
      target: "≤12 人时/周"
      measure: 工时系统

