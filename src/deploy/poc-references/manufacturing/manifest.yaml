# ---- ② Killer Scenario 定义 ----
scenario:
  target_customer: 离散制造中型工厂（质检部 + 设备工程部），年产值 1–20 亿，已上线 MES。
  pain_points:
    - 缺陷归因靠老师傅经验，平均 MTTR 长达数小时，新人难以上手。
    - 设备突发停机造成整线停摆，缺乏提前预警手段。
    - 工艺参数调整凭感觉，良率波动找不到系统性根因。
  killer_scenario: |
    质检员在工位上报缺陷（现象/图片/产线/批次）→ 智能体在「质检知识库」检索相似历史缺陷与标准
    → 调用「质检缺陷归因」技能生成 Top-3 根因假设与置信度 → 回查 MES 该批次工艺参数与设备状态印证
    → 输出归因报告 + 整改建议，并自动沉淀为新案例。同时「预测性维护」技能基于设备遥测识别劣化趋势，
    在停机前主动告警；「工艺参数优化」技能基于良率数据给出参数调整区间建议。
  success_metrics:
    - id: defect-mttr
      name: 缺陷归因平均耗时(MTTR)
      baseline: "4 小时/次"
      target: "≤15 分钟/次"
      measure: 系统时间戳（上报→报告）
    - id: first-pass-yield
      name: 一次交检合格率(FPY)
      baseline: "92%"
      target: "≥96%"
      measure: MES 质检汇总
    - id: unplanned-downtime
      name: 设备非计划停机时长
      baseline: "12 小时/月"
      target: "≤5 小时/月"
      measure: MES 设备状态
    - id: knowledge-reuse
      name: 历史案例复用率
      baseline: "≈0（靠口口相传）"
      target: "≥70% 缺陷可命中历史案例"
      measure: 知识库检索命中统计

